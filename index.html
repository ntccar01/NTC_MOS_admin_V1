<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>員生社便當訂購後台管理</title>
<style>
body{font-family:"Microsoft JhengHei",sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#1e293b}.wrap{max-width:1250px;margin:auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 15px #0000000f}h1,h2{color:#1e3a8a;border-bottom:2px solid #1e3a8a;padding-bottom:8px}.login{position:fixed;inset:0;background:#1e3a8a;display:flex;align-items:center;justify-content:center;z-index:999}.loginbox{width:360px;max-width:90%;background:#fff;padding:30px;border-radius:12px;text-align:center}.loginbox input,.loginbox button{width:100%;padding:12px;font-size:16px;box-sizing:border-box;border-radius:7px}.loginbox input{border:1px solid #cbd5e1}.loginbox button{margin-top:10px;background:#1e3a8a;color:#fff;border:0;font-weight:bold}.status{padding:11px;border-radius:8px;margin:12px 0;font-weight:bold}.open{background:#ecfdf5;color:#065f46}.closed{background:#fff1f2;color:#9f1239}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0;background:#f8fafc;padding:12px;border-radius:8px}.btn{border:0;border-radius:6px;padding:9px 13px;color:#fff;font-weight:bold;cursor:pointer}.refresh{background:#1e3a8a}.archive{background:#d97706}.download{background:#0891b2}.pdf{background:#7c3aed}.print{background:#475569}.del{background:#ef4444;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:22px}.card{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:11px;text-align:center}.card h3{margin:0;font-size:.87em;color:#1e40af}.card p{margin:5px 0 0;font-size:1.25em;font-weight:bold;color:#ef4444}.money{background:#ecfdf5;border-color:#10b981}.money p{color:#059669}table{width:100%;border-collapse:collapse;font-size:.88em}th,td{border:1px solid #cbd5e1;padding:8px;vertical-align:middle;text-align:left}th{background:#f8fafc;color:#1e3a8a}.items{white-space:pre-line;line-height:1.5}.paid{color:#059669;font-weight:bold}.unpaid{color:#dc2626;font-weight:bold}.paidtime{font-size:.78em;color:#475569;margin-top:4px;line-height:1.35}.rawclass{font-size:.75em;color:#64748b;margin-top:3px}.class-summary{display:grid;gap:10px}.class-box{border:1px solid #cbd5e1;border-radius:9px;background:#fff;overflow:hidden}.class-box summary{cursor:pointer;list-style:none;padding:12px 14px;background:#f8fafc;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-weight:bold}.class-box summary::-webkit-details-marker{display:none}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:.82em}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}.class-detail{padding:12px}.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.mini-card{background:#f8fafc;border-radius:7px;padding:8px;border:1px solid #e2e8f0}.empty{padding:18px;text-align:center;color:#64748b}.pdf-report{position:fixed;left:0;top:0;width:1050px;background:#fff;color:#111;padding:18px;font-family:"Microsoft JhengHei",sans-serif;box-sizing:border-box;z-index:10001;display:none;overflow:visible}.pdf-report h1,.pdf-report h2{color:#111;border-color:#777;margin:10px 0 7px}.pdf-report h1{font-size:22px}.pdf-report h2{font-size:16px}.pdf-report p{margin:5px 0}.pdf-report table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}.pdf-report th,.pdf-report td{padding:4px;border:1px solid #999;vertical-align:top;word-break:break-word;overflow-wrap:anywhere}.pdf-report th{background:#f3f4f6}.pdf-note{font-size:10px;color:#555}.print-report{display:none;background:#fff;color:#111;font-family:"Microsoft JhengHei",sans-serif}.print-report{width:100%;box-sizing:border-box}.print-report table{width:100%!important;max-width:100%!important;border-collapse:collapse;table-layout:fixed;font-size:8.2pt}.print-report th,.print-report td{border:1px solid #999;padding:3px;vertical-align:top;word-break:break-word;overflow-wrap:anywhere;box-sizing:border-box}.print-report h1{font-size:16pt;text-align:center;margin:0 0 4mm}.print-report h2{font-size:11pt;margin:4mm 0 1.5mm;border-bottom:1px solid #666}.print-report p{font-size:8pt;margin:1.5mm 0}.print-report .pdf-note{font-size:8pt}@media(max-width:820px){body{padding:8px}.wrap{padding:12px;overflow-x:auto}.toolbar{min-width:720px}table{min-width:980px}.class-box{min-width:720px}}@page{size:A4 landscape;margin:6mm}@media print{body{background:#fff!important;padding:0!important;margin:0!important}.login,#main,#pdfReport{display:none!important}.print-report{display:block!important;width:100%!important;margin:0!important;padding:0!important}.print-report table{min-width:0!important}.print-report tr{page-break-inside:avoid}.print-report thead{display:table-header-group}.print-report h2{page-break-after:avoid}}
</style>
</head><body>
<div id="login" class="login"><div class="loginbox"><h2>🔐 後台管理驗證</h2><input type="password" id="key" placeholder="請輸入管理員代碼"><button onclick="login()">進入後台</button></div></div>
<div id="main" class="wrap" style="display:none">
<h1>📋 國立臺東專科學校員生社－訂單管理後台</h1>
<div id="systemStatus" class="status">讀取系統狀態中...</div>
<div class="toolbar">
  <button class="btn refresh" onclick="loadAll()">🔄 重新整理</button>
  <button class="btn archive" onclick="archiveAndReset()">🗄️ 封存備份並重設新表</button>
  <button class="btn download" onclick="exportCsv()">📊 下載 CSV</button>
  <button class="btn download" onclick="exportTxt()">📝 下載 TXT</button>
  <button class="btn pdf" onclick="saveAsPdf()">📄 另存 PDF</button>
  <button class="btn print" onclick="printReport()">🖨️ 列印班級 / 處室彙整</button>
</div>
<h2>📊 今日數據統計</h2><div id="summary" class="grid"></div>
<h2>🏫 班級 / 處室彙整</h2><div id="classSummary" class="class-summary"></div>
<h2>📝 原始訂單明細列表</h2>
<table><thead><tr><th>訂單時間</th><th>班級/處室</th><th>負責人</th><th>聯絡電話</th><th>訂購明細</th><th>金額</th><th>付款狀態</th><th>操作</th></tr></thead><tbody id="list"></tbody></table>
</div>
<div id="pdfReport" class="pdf-report"></div>
<div id="printReport" class="print-report"></div>
<script>
const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbwcP7sTmtMlspHEFQ2kZaXvDmT6NAIsyuSGGghuHuSq1YujGJ1SW2ZMEjeg6U0sPVzV/exec",ADMIN_KEY="team777";
let currentOrders=[],currentServerDate='',currentServerTime='';
function login(){if(document.getElementById('key').value.trim()!==ADMIN_KEY){alert('❌ 管理員代碼錯誤');return}document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';loadAll()}
async function loadAll(){await Promise.all([loadStatus(),loadOrders()])}
async function loadStatus(){try{const r=await fetch(`${GAS_WEB_APP_URL}?action=getSystemStatus&_=${Date.now()}`),j=await r.json();if(j.status!=='success')throw new Error(j.message);const s=j.data,b=document.getElementById('systemStatus');currentServerDate=s.date||'';currentServerTime=s.time||'';b.className='status '+(s.isOpen?'open':'closed');b.innerHTML=(s.isOpen?'🟢 訂餐開放中｜':'🔴 訂餐關閉中｜')+esc(s.message)+`<br><small>伺服器時間：${esc(s.date)} ${esc(s.time)}</small>`}catch(e){document.getElementById('systemStatus').textContent='⚠️ 無法取得系統狀態：'+e.message}}
function parseItems(desc){const out=[];String(desc||'').split('\n').forEach(line=>{const m=line.trim().match(/^(.+?)\s+x\s+(\d+)\s*\((.*?)\)\s*-\s*\$(\d+)/);if(m)out.push({name:m[1].trim(),qty:Number(m[2])||0,note:m[3].trim(),subtotal:Number(m[4])||0});else{const m2=line.trim().match(/^(.+?)\s+x\s+(\d+)/);if(m2)out.push({name:m2[1].trim(),qty:Number(m2[2])||0,note:'',subtotal:0})}});return out}
function aggregateOrders(orders){const itemCounts={},classes={};let paid=0,unpaid=0,totalBoxes=0;orders.forEach(o=>{const amt=Number(o.total_amount)||0;o.paid?paid+=amt:unpaid+=amt;const cls=o.class||'未分類';if(!classes[cls])classes[cls]={name:cls,orders:[],boxes:0,total:0,paid:0,unpaid:0,items:{}};const c=classes[cls];c.orders.push(o);c.total+=amt;o.paid?c.paid+=amt:c.unpaid+=amt;parseItems(o.items_desc).forEach(it=>{itemCounts[it.name]=(itemCounts[it.name]||0)+it.qty;totalBoxes+=it.qty;c.boxes+=it.qty;c.items[it.name]=(c.items[it.name]||0)+it.qty})});return{itemCounts,paid,unpaid,totalBoxes,classes}}
async function loadOrders(){const list=document.getElementById('list'),summary=document.getElementById('summary'),classSummary=document.getElementById('classSummary');list.innerHTML='<tr><td colspan="8" style="text-align:center">⏳ 讀取中...</td></tr>';classSummary.innerHTML='<div class="empty">⏳ 讀取中...</div>';try{const r=await fetch(`${GAS_WEB_APP_URL}?action=getOrders&adminKey=${encodeURIComponent(ADMIN_KEY)}&_=${Date.now()}`),j=await r.json();if(j.status!=='success')throw new Error(j.message);currentOrders=j.data||[];const agg=aggregateOrders(currentOrders);renderOrders(currentOrders);renderSummary(agg);renderClassSummary(agg.classes)}catch(e){list.innerHTML=`<tr><td colspan="8" style="color:red">讀取失敗：${esc(e.message)}</td></tr>`;classSummary.innerHTML=`<div class="empty" style="color:red">讀取失敗：${esc(e.message)}</div>`}}
function renderOrders(orders){let rows='';orders.forEach(o=>{const amt=Number(o.total_amount)||0;const normalizedNote=o.class_raw&&o.class_raw!==o.class?`<div class="rawclass">原填：${esc(o.class_raw)}</div>`:'';const timeHtml=o.paid?(o.paid_time?`<div class="paidtime">付款時間：<br>${esc(o.paid_time)}</div>`:`<div class="paidtime">舊資料：未記錄付款時間</div>`):'';rows+=`<tr><td>${esc(o.order_time)}</td><td><b>${esc(o.class)}</b>${normalizedNote}</td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td><td class="items">${esc(o.items_desc)}</td><td><b>$${amt}</b></td><td><label><input class="pay" type="checkbox" ${o.paid?'checked':''} onchange="togglePaid('${attr(o.order_id)}',${o.rowIndex},this.checked)"> <span class="${o.paid?'paid':'unpaid'}">${o.paid?'已付費':'未付'}</span></label>${timeHtml}</td><td><button class="btn del" onclick="deleteOrder('${attr(o.order_id)}',${o.rowIndex})">刪</button></td></tr>`});if(!rows)rows='<tr><td colspan="8" style="text-align:center">目前尚無訂單</td></tr>';document.getElementById('list').innerHTML=rows}
function renderSummary(agg){let cards=Object.entries(agg.itemCounts).map(([n,q])=>`<div class="card"><h3>${esc(n)}</h3><p>${q} 份</p></div>`).join('');cards+=`<div class="card"><h3>🍱 總便當數</h3><p>${agg.totalBoxes} 份</p></div><div class="card money"><h3>💰 已收總額</h3><p>$${agg.paid}</p></div><div class="card"><h3>⏳ 未收總額</h3><p>$${agg.unpaid}</p></div><div class="card"><h3>📦 總訂單數</h3><p>${currentOrders.length} 筆</p></div>`;document.getElementById('summary').innerHTML=cards}
function renderClassSummary(classes){const entries=Object.values(classes).sort((a,b)=>a.name.localeCompare(b.name,'zh-TW',{numeric:true}));if(!entries.length){document.getElementById('classSummary').innerHTML='<div class="empty">目前尚無班級/處室訂單</div>';return}document.getElementById('classSummary').innerHTML=entries.map(c=>{const itemRows=Object.entries(c.items).sort((a,b)=>a[0].localeCompare(b[0],'zh-TW')).map(([n,q])=>`<tr><td>${esc(n)}</td><td><b>${q} 份</b></td></tr>`).join('');const orderRows=c.orders.map(o=>`<tr><td>${esc(o.order_time)}</td><td>${esc(o.name)}</td><td>${parseItems(o.items_desc).reduce((s,x)=>s+x.qty,0)} 份</td><td>$${Number(o.total_amount)||0}</td><td>${o.paid?`<span class="paid">已付</span>${o.paid_time?`<br><small>${esc(o.paid_time)}</small>`:''}`:'<span class="unpaid">未付</span>'}</td></tr>`).join('');return`<details class="class-box" open><summary><span>🏫 ${esc(c.name)}</span><span class="pill">${c.orders.length} 筆訂單</span><span class="pill green">🍱 ${c.boxes} 份</span><span class="pill">總額 $${c.total}</span>${c.unpaid?`<span class="pill red">未收 $${c.unpaid}</span>`:`<span class="pill green">已全數收款</span>`}</summary><div class="class-detail"><div class="mini-grid"><div class="mini-card"><b>便當總數</b><br>${c.boxes} 份</div><div class="mini-card"><b>總金額</b><br>$${c.total}</div><div class="mini-card"><b>已收</b><br>$${c.paid}</div><div class="mini-card"><b>未收</b><br>$${c.unpaid}</div></div><div style="display:grid;grid-template-columns:minmax(260px,1fr) minmax(420px,2fr);gap:12px"><div><b>🍱 品項彙整</b><table><thead><tr><th>品項</th><th>數量</th></tr></thead><tbody>${itemRows}</tbody></table></div><div><b>📝 此班原始訂單</b><table><thead><tr><th>時間</th><th>負責人</th><th>便當數</th><th>金額</th><th>付款</th></tr></thead><tbody>${orderRows}</tbody></table></div></div></div></details>`}).join('')}
async function togglePaid(orderId,rowIndex,paid){try{const r=await fetch(GAS_WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'updatePaidStatus',adminKey:ADMIN_KEY,orderId,rowIndex,paid})}),j=await r.json();if(j.status!=='success')throw new Error(j.message);await loadOrders()}catch(e){alert('更新失敗：'+e.message);await loadOrders()}}
async function deleteOrder(orderId,rowIndex){if(!confirm('⚠️ 確定刪除這筆訂單？'))return;try{const r=await fetch(GAS_WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'deleteOrder',adminKey:ADMIN_KEY,orderId,rowIndex})}),j=await r.json();if(j.status!=='success')throw new Error(j.message);await loadOrders()}catch(e){alert('刪除失敗：'+e.message)}}
async function archiveAndReset(){if(!confirm('🚨 確定封存目前訂單並建立新表？'))return;try{const r=await fetch(GAS_WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'archiveAndReset',adminKey:ADMIN_KEY})}),j=await r.json();alert(j.message);await loadOrders()}catch(e){alert('封存失敗：'+e.message)}}
function exportCsv(){if(!currentOrders.length)return alert('目前無資料');let csv='\uFEFF訂單ID,訂單時間,班級/處室,原始班級輸入,負責人,聯絡電話,訂購明細,總金額,付款狀態,付款時間\n';currentOrders.forEach(o=>{const d=`"${String(o.items_desc||'').replace(/"/g,'""')}"`;csv+=`"${o.order_id}","${o.order_time}","${o.class}","${o.class_raw||''}","${o.name}",="${o.phone}",${d},${o.total_amount},"${o.paid?'已付費':'未付費'}","${o.paid_time||''}"\n`});download(csv,'text/csv;charset=utf-8',`${reportDate()}_便當訂單備份.csv`)}
function exportTxt(){if(!currentOrders.length)return alert('目前無資料');const agg=aggregateOrders(currentOrders);let t=`國立臺東專科學校員生社 訂單備份\n日期：${reportDate()}\n`+'='.repeat(60)+'\n\n【班級/處室彙整】\n';Object.values(agg.classes).sort((a,b)=>a.name.localeCompare(b.name,'zh-TW',{numeric:true})).forEach(c=>{t+=`${c.name}｜${c.boxes}份｜${c.orders.length}筆｜總額$${c.total}｜已收$${c.paid}｜未收$${c.unpaid}\n`;Object.entries(c.items).forEach(([n,q])=>t+=`  - ${n}：${q}份\n`)});t+='\n【原始訂單】\n';currentOrders.forEach(o=>t+=`[${o.class}] ${o.name} (${o.phone}) | $${o.total_amount} | ${o.paid?'已付費':'未付'}${o.paid_time?' | 付款 '+o.paid_time:''}\n${o.items_desc}\n${'-'.repeat(60)}\n`);download(t,'text/plain;charset=utf-8',`${reportDate()}_便當訂單備份.txt`)}
function reportDate(){if(currentServerDate)return currentServerDate;const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function buildReportHtml(){const agg=aggregateOrders(currentOrders),classes=Object.values(agg.classes).sort((a,b)=>a.name.localeCompare(b.name,'zh-TW',{numeric:true}));let classRows=classes.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.orders.length}</td><td><b>${c.boxes}</b></td><td>$${c.total}</td><td>$${c.paid}</td><td>$${c.unpaid}</td><td>${Object.entries(c.items).map(([n,q])=>`${esc(n)} ${q}份`).join('<br>')}</td></tr>`).join('');let orderRows=currentOrders.map(o=>`<tr><td>${esc(o.order_time)}</td><td>${esc(o.class)}</td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td><td>${esc(o.items_desc).replace(/\n/g,'<br>')}</td><td>$${o.total_amount}</td><td>${o.paid?'已付費':'未付費'}${o.paid_time?`<br>${esc(o.paid_time)}`:''}</td></tr>`).join('');return`<h1>國立臺東專科學校員生社 便當訂單備份</h1><p>日期：${esc(reportDate())}　產出時間：${esc(currentServerTime||new Date().toLocaleTimeString('zh-TW'))}</p><h2>今日總覽</h2><table><colgroup><col style="width:25%"><col style="width:25%"><col style="width:25%"><col style="width:25%"></colgroup><tr><th>總便當數</th><th>總訂單數</th><th>已收總額</th><th>未收總額</th></tr><tr><td>${agg.totalBoxes} 份</td><td>${currentOrders.length} 筆</td><td>$${agg.paid}</td><td>$${agg.unpaid}</td></tr></table><h2>班級 / 處室彙整</h2><table><colgroup><col style="width:13%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:37%"></colgroup><thead><tr><th>班級/處室</th><th>訂單筆數</th><th>便當總數</th><th>總金額</th><th>已收</th><th>未收</th><th>品項彙整</th></tr></thead><tbody>${classRows}</tbody></table><h2>原始訂單明細</h2><table><colgroup><col style="width:17%"><col style="width:11%"><col style="width:10%"><col style="width:12%"><col style="width:30%"><col style="width:8%"><col style="width:12%"></colgroup><thead><tr><th>訂單時間</th><th>班級/處室</th><th>負責人</th><th>電話</th><th>訂購明細</th><th>金額</th><th>付款</th></tr></thead><tbody>${orderRows}</tbody></table><p class="pdf-note">備註：班級彙整僅作現場核對，原始訂單仍逐筆保留，付款時間以 Google Apps Script 伺服器時間為準。</p>`}
function buildPdfReport(){return buildReportHtml()}
function preparePrintReport(){const r=document.getElementById('printReport');r.innerHTML=buildReportHtml();return r}
function printReport(){if(!currentOrders.length)return alert('目前無資料');preparePrintReport();setTimeout(()=>window.print(),80)}
function saveAsPdf(){if(!currentOrders.length)return alert('目前無資料');preparePrintReport();document.title=`${reportDate()}_便當訂單備份`;setTimeout(()=>window.print(),80)}
function download(content,type,name){const b=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}
</script></body></html>
